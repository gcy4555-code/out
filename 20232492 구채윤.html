let currentRegion = '전체';
let currentMood = 'all';

function filterRegion(region) {
  currentRegion = region;
  document.querySelectorAll('.region-tab').forEach(b => {
    b.classList.toggle('active', b.textContent === region);
  });
  renderCards();
}

function filterMood(mood) {
  currentMood = mood;
  document.querySelectorAll('.mood-btn').forEach(b => {
    b.classList.toggle('active', b.getAttribute('onclick').includes(`'${mood}'`));
  });
  renderCards();
}

function renderCards() {
  let filtered = PLACES;
  if (currentRegion !== '전체') filtered = filtered.filter(p => p.region === currentRegion);
  if (currentMood !== 'all') filtered = filtered.filter(p => p.category === currentMood);

  const grid = document.getElementById('cardsGrid');
  const label = document.getElementById('sectionLabel');
  label.textContent = `${currentRegion !== '전체' ? currentRegion + ' ' : ''}${currentMood !== 'all' ? currentMood + ' ' : ''}추천 명소 ${filtered.length}곳`;

  const tips = {
    '맛집': '🍽 새로운 맛의 경험은 뇌의 보상 회로를 활성화해요. 먹는 게 최고의 힐링!',
    '자연': '🌿 자연 속에서 20분만 있어도 스트레스 호르몬이 감소해요. 숲으로 가세요.',
    '카페': '☕ 낯선 카페에서 멍 때리기. 생산적이지 않아도 괜찮아요.',
    '문화': '🎨 예술 감상은 뇌를 전환시켜요. 작품 앞에서 생각을 내려놓아 보세요.',
    '야경': '🌙 밤 공기와 빛의 조합은 마음을 차분하게 만들어 줘요.',
  };
  const tipBox = document.getElementById('tipBox');
  if (currentMood !== 'all' && tips[currentMood]) {
    tipBox.innerHTML = `<strong>💡 ${currentMood} 탈출 팁</strong>${tips[currentMood]}`;
  } else {
    tipBox.innerHTML = '<strong>💡 오늘의 탈출 팁</strong>번아웃이 왔을 때 가장 좋은 처방은 "새로운 풍경"이에요. 익숙한 공간을 벗어나 낯선 맛과 장소를 만나면 뇌가 리셋됩니다. 지금 바로 어디든 떠나보세요.';
  }

  if (filtered.length === 0) {
    grid.innerHTML = `<div style="grid-column:1/-1;text-align:center;padding:3rem;color:#aaa;font-size:14px;">해당 조건의 명소가 없어요.<br>다른 필터를 선택해보세요.</div>`;
    return;
  }

  grid.innerHTML = filtered.map(p => `
    <div class="place-card" onclick="openDetail(${p.id})">
      <div class="card-thumb" style="background:${p.bg}">
        ${p.emoji}
        <span class="card-category-tag" style="background:${p.tagColor};color:${p.tagText}">${p.category}</span>
      </div>
      <div class="card-body">
        <div class="card-name">${p.name}</div>
        <div class="card-loc"><i class="ti ti-map-pin" style="font-size:12px" aria-hidden="true"></i> ${p.loc}</div>
        <div class="card-desc">${p.desc}</div>
        <div class="card-tags">${p.tags.map(t=>`<span class="tag">${t}</span>`).join('')}</div>
      </div>
    </div>
  `).join('');
}

function openDetail(id) {
  const p = PLACES.find(x => x.id === id);
  if (!p) return;
  const panel = document.getElementById('detailPanel');
  panel.innerHTML = `
    <button class="detail-close" onclick="document.getElementById('detailOverlay').classList.remove('open')">×</button>
    <div class="detail-title">${p.emoji} ${p.name}</div>
    <div class="detail-sub"><i class="ti ti-map-pin" style="font-size:13px" aria-hidden="true"></i> ${p.loc} · ${p.category}</div>
    <div style="display:flex;flex-wrap:wrap;gap:5px;margin-bottom:12px">${p.tags.map(t=>`<span class="tag">${t}</span>`).join('')}</div>
    <div style="font-size:14px;color:#333;line-height:1.75;padding:12px 0;border-top:0.5px solid #e8e4de;border-bottom:0.5px solid #e8e4de">${p.desc}</div>
    <div class="detail-section">
      <h4>왜 번아웃에 좋을까요?</h4>
      <div style="font-size:13px;color:#444;line-height:1.7;background:#f5f2ed;border-radius:8px;padding:12px 14px">${p.detail.why}</div>
    </div>
    <div class="detail-section">
      <h4>여행 팁</h4>
      <div class="detail-info-row"><i class="ti ti-bulb" style="font-size:16px" aria-hidden="true"></i><span>${p.detail.tip}</span></div>
    </div>
    <div class="detail-section">
      <h4>주변 추천</h4>
      <div class="detail-recs">
        ${p.detail.recs.map(r=>`<div class="rec-item"><strong>${r.name}</strong><span>${r.desc}</span></div>`).join('')}
      </div>
    </div>
    <button style="width:100%;margin-top:1.25rem;padding:12px;background:#1c2b1e;color:#f5f0e8;border:none;border-radius:10px;font-size:14px;font-family:'Noto Sans KR',sans-serif;cursor:pointer;font-weight:500" onclick="sendPrompt('${p.name} 주변 여행 일정 1박 2일로 짜줘')">이 곳 중심으로 코스 짜줘 ↗</button>
  `;
  document.getElementById('detailOverlay').classList.add('open');
}

function closeDetail(e) {
  if (e.target === document.getElementById('detailOverlay')) {
    document.getElementById('detailOverlay').classList.remove('open');
  }
}

renderCards();
</script>
