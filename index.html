<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>김채원 사진 모음집 (CHAEWON GALLERY)</title>
    <style>
        /* 전체 스타일 초기화 */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, Roboto, sans-serif;
            background-color: #0f0f11;
            color: #ffffff;
            line-height: 1.6;
        }

        /* 헤더 스타일 */
        header {
            text-align: center;
            padding: 40px 20px;
            background: linear-gradient(to bottom, #1a1a24, #0f0f11);
            border-bottom: 1px solid #222;
        }

        header h1 {
            font-size: 2.5rem;
            font-weight: 800;
            letter-spacing: 2px;
            margin-bottom: 10px;
            background: linear-gradient(45deg, #ff758c, #ff7eb3);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        header p {
            color: #aaa;
            font-size: 1rem;
        }

        /* 갤러리 컨테이너 */
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 30px 20px;
        }

        /* 이미지 그리드 시스템 (반응형) */
        .gallery-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 20px;
        }

        /* 이미지 카드 스타일 */
        .gallery-item {
            position: relative;
            overflow: hidden;
            border-radius: 12px;
            background-color: #1a1a24;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.5);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            cursor: pointer;
            aspect-ratio: 3 / 4; /* 세로형 아이돌 사진에 최적화 */
        }

        .gallery-item:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 25px rgba(255, 117, 140, 0.3);
        }

        .gallery-item img {
            width: 100%;
            height: 100%;
            object-fit: cover; /* 이미지가 잘리지 않고 꽉 차게 */
            transition: transform 0.3s ease;
        }

        .gallery-item:hover img {
            transform: scale(1.05);
        }

        /* 하단 푸터 */
        footer {
            text-align: center;
            padding: 40px 20px;
            color: #666;
            font-size: 0.9rem;
            border-top: 1px solid #222;
            margin-top: 50px;
        }

        /* 라이트박스(이미지 크게 보기) 모달 스크립트용 */
        .modal {
            display: none;
            position: fixed;
            z-index: 1000;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.9);
            justify-content: center;
            align-items: center;
        }

        .modal-content {
            max-width: 90%;
            max-height: 85%;
            border-radius: 8px;
            box-shadow: 0 0 20px rgba(255,255,255,0.2);
        }

        .close-btn {
            position: absolute;
            top: 20px;
            right: 30px;
            color: #fff;
            font-size: 40px;
            font-weight: bold;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <!-- 헤더 영역 -->
    <header>
        <h1>CHAEWON GALLERY</h1>
        <p>르세라핌 김채원 사진 모음집</p>
    </header>

    <!-- 갤러리 메인 영역 -->
    <div class="container">
        <div class="gallery-grid">
            
            <!-- [사진 카드 시작] 아래 src="링크" 부분에 실제 이미지 주소를 넣어주세요 -->
            <div class="gallery-item" onclick="openModal(this)">
                <img src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?auto=format&fit=crop&w=500&q=80" alt="김채원 사진 1">
            </div>

            <div class="gallery-item" onclick="openModal(this)">
                <img src="https://images.unsplash.com/photo-1517841905240-472988babdf9?auto=format&fit=crop&w=500&q=80" alt="김채원 사진 2">
            </div>

            <div class="gallery-item" onclick="openModal(this)">
                <img src="https://images.unsplash.com/photo-1524504388940-b1c1722653e1?auto=format&fit=crop&w=500&q=80" alt="김채원 사진 3">
            </div>

            <div class="gallery-item" onclick="openModal(this)">
                <img src="https://images.unsplash.com/photo-1494790108377-be9c29b29330?auto=format&fit=crop&w=500&q=80" alt="김채원 사진 4">
            </div>

            <div class="gallery-item" onclick="openModal(this)">
                <img src="https://images.unsplash.com/photo-1507003211169-0a1dd7228f2d?auto=format&fit=crop&w=500&q=80" alt="김채원 사진 5">
            </div>

            <div class="gallery-item" onclick="openModal(this)">
                <img src="https://images.unsplash.com/photo-1539571696357-5a69c17a67c6?auto=format&fit=crop&w=500&q=80" alt="김채원 사진 6">
            </div>
            <!-- [사진 카드 끝] -->

        </div>
    </div>

    <!-- 푸터 영역 -->
    <footer>
        <p>&copy; 2026 CHAEWON Fan Gallery. All rights reserved.</p>
    </footer>

    <!-- 이미지 크게 보기 모달 -->
    <div id="myModal" class="modal" onclick="closeModal()">
        <span class="close-btn">&times;</span>
        <img class="modal-content" id="modalImg">
    </div>

    <!-- 기능 구현용 자바스크립트 -->
    <script>
        function openModal(element) {
            const modal = document.getElementById("myModal");
            const modalImg = document.getElementById("modalImg");
            const clickedImgSrc = element.querySelector("img").src;
            
            modal.style.display = "flex";
            modalImg.src = clickedImgSrc;
        }

        function closeModal() {
            const modal = document.getElementById("myModal");
            modal.style.display = "none";
        }
    </script>

</body>
</html>
