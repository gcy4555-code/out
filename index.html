<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>탈출 ESCAPE — 부산·울산 혼여 힐링</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;600;700&display=swap" rel="stylesheet" />
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Noto Sans KR', sans-serif; background: #faf8f4; color: #1a1a1a; font-size: 14px; }
  button { font-family: inherit; cursor: pointer; }

  /* ── 상단 바 ── */
  #top-bar {
    position: sticky; top: 0; z-index: 100;
    background: rgba(27,58,92,0.97); backdrop-filter: blur(12px);
    display: flex; align-items: center; justify-content: space-between;
    padding: 0 16px; height: 52px;
    border-bottom: 1px solid rgba(255,255,255,0.08);
  }
  .logo { display: flex; align-items: center; gap: 9px; }
  .logo-text .title { font-family: Georgia, serif; font-size: 13px; font-weight: 700; color: #f0ece4; letter-spacing: 0.04em; }
  .logo-text .sub { font-size: 9px; color: rgba(255,255,255,0.4); letter-spacing: 0.15em; margin-top: 2px; }
  #bar-date { font-size: 11px; color: rgba(255,255,255,0.4); letter-spacing: 0.05em; }
  #refresh-btn {
    display: flex; align-items: center; gap: 6px;
    background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.18);
    border-radius: 20px; padding: 6px 13px;
    color: #f0ece4; font-size: 12px;
  }
  #refresh-btn:hover { background: rgba(255,255,255,0.18); }
  #refresh-icon { display: inline-block; transition: transform 0.6s; }
  #refresh-icon.spin { transform: rotate(360deg); }

  /* ── 히어로 ── */
  #hero {
    background: linear-gradient(160deg, #0f2740 0%, #1b3a5c 45%, #2d6a8f 100%);
    padding: 2.5rem 1.5rem; text-align: center; position: relative; overflow: hidden;
  }
  .hero-badge {
    display: inline-flex; align-items: center; gap: 5px;
    background: rgba(79,163,195,0.2); border: 1px solid rgba(79,163,195,0.4);
    color: #7dd3f0; font-size: 10px; letter-spacing: 0.18em;
    padding: 4px 14px; border-radius: 20px; margin-bottom: 14px;
  }
  #hero h1 { font-family: Georgia, serif; font-size: 2.1rem; font-weight: 700; color: #f0ece4; line-height: 1.25; margin-bottom: 8px; }
  #hero h1 em { color: #7dd3f0; font-style: normal; }
  #hero p { color: rgba(255,255,255,0.45); font-size: 0.88rem; font-weight: 300; }
  .hero-stats { display: flex; justify-content: center; gap: 24px; margin-top: 20px; align-items: center; }
  .hero-stat { text-align: center; }
  .hero-stat strong { display: block; font-size: 20px; font-weight: 700; color: #f0ece4; font-family: Georgia, serif; }
  .hero-stat span { font-size: 10px; color: rgba(255,255,255,0.4); letter-spacing: 0.08em; }
  .hero-divider { width: 1px; height: 30px; background: rgba(255,255,255,0.15); }

  /* ── 필터 ── */
  #filter-section { background: #fff; border-bottom: 1px solid rgba(0,0,0,0.09); }
  #region-tabs { display: flex; padding: 12px 16px 0; gap: 0; overflow-x: auto; }
  .region-tab {
    flex-shrink: 0; padding: 8px 16px; font-size: 13px;
    background: none; border: none; border-bottom: 2px solid transparent;
    color: #888; font-weight: 400; transition: all 0.15s;
  }
  .region-tab.active { border-bottom-color: #4fa3c3; color: #1b3a5c; font-weight: 600; }
  #cat-bar { display: flex; gap: 7px; padding: 10px 16px 12px; overflow-x: auto; }
  .cat-btn {
    flex-shrink: 0; display: flex; align-items: center; gap: 5px;
    border: 1px solid #e0dbd4; background: #faf8f4;
    border-radius: 20px; padding: 6px 13px; font-size: 12px;
    color: #555; transition: all 0.15s; white-space: nowrap;
  }
  .cat-btn.active { border-color: #1b3a5c; background: #1b3a5c; color: #f0ece4; }

  /* ── 컨텐츠 ── */
  #content { padding: 16px; }
  #tip-box {
    background: linear-gradient(135deg, #eaf5fb, #f0f7ff);
    border: 1px solid #bcd8ec; border-radius: 12px;
    padding: 14px 16px; margin-bottom: 16px;
    font-size: 13px; color: #1b3a5c; line-height: 1.75;
  }
  #tip-box strong { font-weight: 600; display: block; margin-bottom: 4px; font-size: 12px; letter-spacing: 0.05em; color: #2d6a8f; }
  #section-label {
    font-size: 11px; letter-spacing: 0.12em; color: #aaa;
    text-transform: uppercase; margin-bottom: 12px;
    display: flex; align-items: center; gap: 6px;
  }
  #count-badge { background: #1b3a5c; color: #fff; font-size: 10px; padding: 1px 7px; border-radius: 10px; font-weight: 500; }
  #grid {
    display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
    gap: 14px; margin-bottom: 5rem;
  }

  /* ── 카드 ── */
  .card {
    background: #fff; border: 1px solid rgba(0,0,0,0.09);
    border-radius: 14px; overflow: hidden; cursor: pointer;
    transition: transform 0.18s, box-shadow 0.18s;
  }
  .card:hover { transform: translateY(-3px); box-shadow: 0 8px 28px rgba(27,58,92,0.12); }
  .card-thumb {
    height: 160px; display: flex; align-items: center; justify-content: center;
    font-size: 3rem; position: relative; overflow: hidden;
  }
  .card-thumb img {
    position: absolute; inset: 0; width: 100%; height: 100%;
    object-fit: cover; transition: transform 0.4s ease;
  }
  .card:hover .card-thumb img { transform: scale(1.06); }
  .card-thumb-overlay {
    position: absolute; inset: 0;
    background: linear-gradient(to bottom, rgba(0,0,0,0.08) 0%, rgba(0,0,0,0.25) 100%);
  }
  .cat-tag {
    position: absolute; top: 10px; left: 10px; font-size: 10px;
    padding: 3px 10px; border-radius: 20px; font-weight: 600; letter-spacing: 0.05em;
  }
  .solo-badge {
    position: absolute; top: 10px; right: 10px; font-size: 10px;
    padding: 3px 9px; border-radius: 20px;
    background: rgba(0,0,0,0.55); color: #fff;
  }
  .card-body { padding: 14px 16px 16px; }
  .card-name { font-size: 15px; font-weight: 600; margin-bottom: 3px; color: #1a1a1a; }
  .card-loc { font-size: 11px; color: #aaa; margin-bottom: 8px; }
  .card-desc { font-size: 13px; color: #555; line-height: 1.65; margin-bottom: 11px; }
  .card-tags { display: flex; flex-wrap: wrap; gap: 5px; }
  .tag { font-size: 11px; padding: 2px 9px; border-radius: 20px; border: 1px solid #e4dfd9; color: #666; background: #f5efe6; }
  .solo-score { display: flex; align-items: center; gap: 6px; margin-top: 10px; font-size: 12px; color: #888; }
  .score-dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; }

  /* ── 하단 네비 ── */
  #bottom-nav {
    position: sticky; bottom: 0;
    background: rgba(255,255,255,0.97); border-top: 1px solid rgba(0,0,0,0.09);
    display: flex; justify-content: space-around; padding: 10px 0;
  }
  .nav-item {
    display: flex; flex-direction: column; align-items: center; gap: 3px;
    font-size: 10px; color: #bbb; background: none; border: none; padding: 0 14px;
  }
  .nav-item.active { color: #1b3a5c; }

  /* ── 오버레이 ── */
  #overlay {
    display: none; position: fixed; inset: 0;
    background: rgba(10,20,35,0.82); z-index: 200; align-items: flex-end;
  }
  #overlay.open { display: flex; }
  #panel {
    background: #faf8f4; border-radius: 20px 20px 0 0;
    padding: 1.5rem; width: 100%; max-height: 85vh; overflow-y: auto;
  }
  .handle { width: 36px; height: 4px; background: #ddd; border-radius: 2px; margin: 0 auto 20px; }
  #close-btn {
    float: right; background: #f0ece4; border: none; font-size: 18px;
    color: #888; width: 30px; height: 30px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
  }
  #close-btn:hover { background: #e0dbd4; }
  .detail-title { font-family: Georgia, serif; font-size: 1.3rem; font-weight: 700; margin-bottom: 4px; padding-right: 2.5rem; line-height: 1.4; }
  .detail-sub { font-size: 12px; color: #aaa; margin-bottom: 12px; }
  .detail-desc { font-size: 14px; color: #333; line-height: 1.75; padding: 12px 0; border-top: 1px solid #ede9e2; border-bottom: 1px solid #ede9e2; }
  .detail-section { margin-top: 14px; }
  .detail-section h4 { font-size: 11px; letter-spacing: 0.1em; color: #bbb; margin-bottom: 8px; font-weight: 500; text-transform: uppercase; }
  .detail-why { font-size: 13px; color: #444; line-height: 1.75; background: #eaf5fb; border-radius: 10px; padding: 12px 14px; border-left: 3px solid #4fa3c3; }
  .detail-tip { font-size: 13px; color: #333; line-height: 1.65; }
  .rec-item { background: #f5f2ed; border-radius: 10px; padding: 11px 14px; margin-bottom: 8px; }
  .rec-name { font-size: 13px; font-weight: 600; display: block; margin-bottom: 2px; color: #1a1a1a; }
  .rec-desc { font-size: 12px; color: #666; line-height: 1.5; }
  #cta-btn {
    width: 100%; margin-top: 16px; padding: 13px;
    background: #1b3a5c; color: #f0ece4; border: none; border-radius: 12px;
    font-size: 14px; font-weight: 500;
  }
  #cta-btn:hover { background: #2d6a8f; }

  .empty-msg { grid-column: 1/-1; text-align: center; padding: 3rem; color: #aaa; }
  .empty-msg .empty-icon { font-size: 3rem; margin-bottom: 10px; }
</style>
</head>
<body>

<!-- 상단 바 -->
<div id="top-bar">
  <div class="logo">
    <svg width="34" height="34" viewBox="0 0 34 34" fill="none">
      <circle cx="17" cy="17" r="16" fill="rgba(255,255,255,0.08)" stroke="rgba(255,255,255,0.2)" stroke-width="1"/>
      <path d="M8 14 Q11 11 14 13 Q17 11 20 13 Q23 11 26 14" stroke="#7dd3f0" stroke-width="1.5" stroke-linecap="round" fill="none"/>
      <path d="M6 20 Q9.5 17.5 13 20 Q16.5 22.5 20 20 Q23.5 17.5 27 20" stroke="rgba(255,255,255,0.5)" stroke-width="1.2" stroke-linecap="round" fill="none"/>
      <path d="M8 24 Q11 22 14 24 Q17 26 20 24 Q23 22 26 24" stroke="rgba(255,255,255,0.25)" stroke-width="1" stroke-linecap="round" fill="none"/>

<!-- 필터 -->
<div id="filter-section">

    <button class="region-tab" data-region="부산">🌊 부산</button>

<!-- 하단 네비 -->
<div id="bottom-nav">
  <button class="nav-item active">🗺️<span>탐색</span></button>
  <button class="nav-item" id="nav-course">🛣️<span>코스 ↗</span></button>

<!-- 상세 오버레이 -->

<script>
const PLACES = [
  { id:1, region:'부산', category:'맛집', emoji:'🦪', bg:'#fdf0ea', tagColor:'#fdd0a8', tagText:'#6b2000', img:'https://images.unsplash.com/photo-1534482421-64566f976cfa?w=600&q=80', name:'기장 대변항 활어회', loc:'부산 기장군 기장읍', solo:'혼밥 OK', soloScore:4, desc:'동해 파도 소리 들으며 먹는 갓 잡은 활어회. 기장 멸치와 성게알도 꼭 추가하세요.', tags:['해산물','바다뷰','가성비','아침식사'], detail:{ why:'바다를 바라보며 먹는 음식은 스트레스 해소에 탁월해요. 파도 소리가 자연의 화이트 노이즈 역할을 해요.', tip:'오전 11~13시 사이가 가장 신선. 1인 소회 접시도 주문 가능. 기장미역 국물 꼭 챙기기.', recs:[{name:'기장 멸치 쌈밥',desc:'기장 특산 멸치로 만든 향토 음식. 1만원대'},{name:'일광해수욕장',desc:'식후 해안 산책 30분 코스. 조용하고 한적'},{name:'기장 연화리 카페',desc:'해안 절경 뷰 카페들이 즐비. 드라이브 연계'}]}},

  { id:15, region:'울산', category:'카페', emoji:'🌅', bg:'#fef5e4', tagColor:'#f5d090', tagText:'#4a2a00', img:'https://images.unsplash.com/photo-1500534314209-a25ddb2bd429?w=600&q=80', name:'간절곶 해안 카페', loc:'울산 울주군 서생면 간절곶', solo:'일출 혼카', soloScore:4, desc:'한반도 최초 일출 명소 간절곶 인근 카페들. 새해가 아니어도 혼자 일출 보러 오기 딱 좋아요.', tags:['일출','해안','조용함','새벽'], detail:{ why:'새로운 하루의 시작을 눈으로 보는 것은 심리적 리셋 효과가 있어요. 새벽 바다의 고요함은 특별해요.', tip:'일출 시간 30분 전 도착 추천. 새벽 카페도 영업하는 곳 있음. 방한 필수.', recs:[{name:'간절곶 등대',desc:'소원 우체통과 등대 포토스팟'},{name:'서생포왜성',desc:'임진왜란 유적지. 바다 뷰 역사 탐방'},{name:'진하해수욕장',desc:'간절곶 바로 옆 해수욕장. 깨끗한 백사장'}]}},
  { id:16, region:'울산', category:'명소', emoji:'🐋', bg:'#e8f0f8', tagColor:'#a0c4e8', tagText:'#0a2a5a', img:'https://images.unsplash.com/photo-1568430462989-44163eb1752f?w=600&q=80', name:'장생포 고래문화특구', loc:'울산 남구 장생포고래로', solo:'혼자 탐방 최고', soloScore:5, desc:'한국 유일의 고래 박물관과 옛 포경 마을. 비일상적인 공간이 굳은 머리를 풀어줘요.', tags:['박물관','역사','특이한','독특'], detail:{ why:'익숙하지 않은 주제의 전시는 뇌에 새로운 자극을 줘요. 고래의 세계로 잠시 도망치는 느낌.', tip:'고래 박물관 + 고래생태체험관 통합권 구매. 장생포 옛 마을 거리도 함께 구경.', recs:[{name:'고래 고기 식당',desc:'장생포에서만 먹을 수 있는 특별한 경험'},{name:'장생포 벽화마을',desc:'고래 테마 벽화들. 포토스팟 가득'},{name:'일산해수욕장',desc:'차로 15분. 시원한 바다 환기 코스'}]}},
  { id:17, region:'울산', category:'자연', emoji:'🦚', bg:'#eef4ee', tagColor:'#b8d8b8', tagText:'#0a3d0a', img:'https://images.unsplash.com/photo-1440342359743-84fcb8c21f21?w=600&q=80', name:'대왕암공원', loc:'울산 동구 일산동', solo:'해안 트레킹 코스', soloScore:5, desc:'기암괴석과 소나무 숲, 동해 바다가 한 곳에 모인 울산의 보물. 걷다 보면 머릿속이 맑아져요.', tags:['자연','해안산책','소나무숲','포토스팟'], detail:{ why:'피톤치드 가득한 소나무 숲과 파도 소리의 조합은 자율신경계를 안정시켜요.', tip:'공원 산책로 전 구간 1.5시간. 슬도와 연계해서 하루 코스. 무료 입장.', recs:[{name:'슬도',desc:'대왕암 옆 작은 섬. 파도 소리가 악기 소리처럼 들림'},{name:'방어진항 해산물',desc:'트레킹 후 신선한 해산물로 에너지 보충'},{name:'일산해수욕장',desc:'해안 산책 후 해변 쉬어가기'}]}},
  { id:18, region:'울산', category:'야경', emoji:'🌁', bg:'#e8ecf4', tagColor:'#a8b8e0', tagText:'#0a1a4a', img:'https://images.unsplash.com/photo-1477959858617-67f85cf4f1df?w=600&q=80', name:'울산대교 전망대 야경', loc:'울산 남구 여천동', solo:'야경 드라이브', soloScore:4, desc:'산업도시 울산만의 독특한 야경. 불꽃 타오르는 공장 야경이 역설적으로 아름다운 풍경이에요.', tags:['야경','드라이브','독특','공업미'], detail:{ why:'예상치 못한 아름다움을 발견할 때 뇌는 강한 보상 반응을 해요. 울산 야경은 그 경험을 선물해요.', tip:'울산대교 전망대에서 전체 뷰 최고. 카메라 꼭 챙기기.', recs:[{name:'울산대교 전망대',desc:'울산만 전체 조망. 낮과 밤 모두 인상적'},{name:'태화강 야경',desc:'대나무 숲과 어우러진 고즈넉한 강 야경'},{name:'장생포 야경',desc:'고래 마을과 항구 불빛의 조화'}]}},
];

const TIPS = {
  '맛집': '🍽️ 낯선 맛의 경험은 뇌의 보상 회로를 활성화해요. 새로운 맛집 탐방이 최고의 환기예요.',
  '카페': '☕ 낯선 카페에서 멍 때리기. 2시간 동안 아무것도 안 해도 괜찮아요. 그게 힐링이에요.',
  '명소': '📍 익숙하지 않은 공간에 있으면 뇌가 현재에 집중해요. 번아웃엔 새로운 장소가 처방전.',
  '자연': '🌿 자연 속 20분만 있어도 코르티솔이 줄어들어요. 바다와 숲으로 탈출하세요.',
  '야경': '🌙 밤 공기와 불빛의 조합은 마음을 차분하게 만들어요. 혼자인 밤이 더 풍부해지는 순간.',
};

// 상태
let currentRegion = '전체';
let currentCat = 'all';
let order = PLACES.map(p => p.id);
let selectedPlace = null;

// 날짜
const now = new Date();
const days = ['일','월','화','수','목','금','토'];
document.getElementById('bar-date').textContent = `${now.getMonth()+1}.${now.getDate()} (${days[now.getDay()]})`;

function shuffle(arr) {
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function getFiltered() {
  return order
    .map(id => PLACES.find(p => p.id === id))
    .filter(p => p
      && (currentRegion === '전체' || p.region === currentRegion)
      && (currentCat === 'all' || p.category === currentCat)
    );
}

function scoreDots(score) {
  return Array(5).fill(0).map((_, i) =>
    `<span class="score-dot" style="background:${i < score ? '#4fa3c3' : '#e0dbd4'}"></span>`
  ).join('');
}

function renderTip() {
  const tipLabel = document.getElementById('tip-label');
  const tipText = document.getElementById('tip-text');
  if (currentCat !== 'all' && TIPS[currentCat]) {
    tipLabel.textContent = `💡 ${currentCat} 힐링 팁`;
    tipText.textContent = TIPS[currentCat];
  } else {
    tipLabel.textContent = '💙 번아웃 탈출 가이드';
    tipText.textContent = '바다를 바라보는 것만으로도 스트레스 호르몬이 줄어든다는 연구 결과가 있어요. 부산·울산은 혼자 와도 전혀 어색하지 않은 곳들이에요. 일단 출발해 보세요.';
  }
}

function renderSectionLabel(count) {
  const label = document.getElementById('section-label');
  const badge = document.getElementById('count-badge');
  let text = '';
  if (currentRegion !== '전체') text += currentRegion + ' ';
  if (currentCat !== 'all') text += currentCat + ' ';
  text += '추천 스팟';
  label.childNodes[0].textContent = text;
  badge.textContent = count;
}

function renderGrid() {
  const filtered = getFiltered();
  document.getElementById('hero-count').textContent = filtered.length;
  renderTip();
  renderSectionLabel(filtered.length);

  const grid = document.getElementById('grid');
  if (filtered.length === 0) {
    grid.innerHTML = `<div class="empty-msg"><div class="empty-icon">🌊</div><p>해당 조건의 스팟이 없어요.<br />다른 필터를 선택해보세요.</p></div>`;
    return;
  }

  grid.innerHTML = filtered.map(p => `
    <div class="card" data-id="${p.id}">
      <div class="card-thumb" style="background:${p.bg}">
        <img src="${p.img}" alt="${p.name}" loading="lazy" onerror="this.style.display='none'">
        <div class="card-thumb-overlay"></div>
        <span class="cat-tag" style="background:${p.tagColor};color:${p.tagText}">${p.category}</span>
        <span class="solo-badge">${p.solo}</span>
      </div>
      <div class="card-body">
        <div class="card-name">${p.name}</div>
        <div class="card-loc">📍 ${p.loc}</div>
        <div class="card-desc">${p.desc}</div>
        <div class="card-tags">${p.tags.map(t => `<span class="tag">${t}</span>`).join('')}</div>
        <div class="solo-score">
          <span>혼여 적합도</span>
          <div style="display:flex;gap:3px">${scoreDots(p.soloScore)}</div>
        </div>
      </div>
    </div>
  `).join('');

  grid.querySelectorAll('.card').forEach(card => {
    card.addEventListener('click', () => {
      const id = parseInt(card.dataset.id);
      openDetail(PLACES.find(p => p.id === id));
    });
  });
}

function openDetail(p) {
  selectedPlace = p;
  document.getElementById('detail-title').textContent = `${p.emoji} ${p.name}`;
  document.getElementById('detail-sub').textContent = `📍 ${p.loc} · ${p.region} · ${p.category}`;
  document.getElementById('detail-tags').innerHTML = p.tags.map(t => `<span class="tag">${t}</span>`).join('');
  document.getElementById('detail-dots').innerHTML = scoreDots(p.soloScore);
  document.getElementById('detail-desc').textContent = p.desc;
  document.getElementById('detail-why').textContent = p.detail.why;
  document.getElementById('detail-tip').innerHTML = `💡 ${p.detail.tip}`;
  document.getElementById('detail-recs').innerHTML = p.detail.recs.map(r => `
    <div class="rec-item">
      <strong class="rec-name">${r.name}</strong>
      <span class="rec-desc">${r.desc}</span>
    </div>
  `).join('');
  document.getElementById('overlay').classList.add('open');
  document.getElementById('panel').scrollTop = 0;
}

function closeDetail() {
  document.getElementById('overlay').classList.remove('open');
  selectedPlace = null;
}

// 이벤트: 닫기
document.getElementById('close-btn').addEventListener('click', closeDetail);
document.getElementById('overlay').addEventListener('click', e => {
  if (e.target === document.getElementById('overlay')) closeDetail();
});

// 이벤트: CTA
document.getElementById('cta-btn').addEventListener('click', () => {
  if (selectedPlace) alert(`"${selectedPlace.name}" 중심으로 부산·울산 혼자 여행 하루 코스를 짜드릴게요!\n(Claude 채팅에서 이 버튼을 누르면 코스를 추천받을 수 있어요.)`);
});

// 이벤트: 하단 네비
document.getElementById('nav-course').addEventListener('click', () => alert('부산·울산 혼자 여행 1박2일 코스는 Claude 채팅에서 질문해보세요!'));
document.getElementById('nav-cafe').addEventListener('click', () => alert('번아웃 해소 부산·울산 카페 추천은 Claude 채팅에서 물어보세요!'));
document.getElementById('nav-food').addEventListener('click', () => alert('부산·울산 혼자 가기 좋은 맛집 추천은 Claude 채팅에서 물어보세요!'));

// 이벤트: 새 추천
document.getElementById('refresh-btn').addEventListener('click', () => {
  const icon = document.getElementById('refresh-icon');
  icon.classList.add('spin');
  setTimeout(() => {
    order = shuffle(order);
    renderGrid();
    icon.classList.remove('spin');
  }, 600);
});

// 이벤트: 지역 탭
document.querySelectorAll('.region-tab').forEach(btn => {
  btn.addEventListener('click', () => {
    currentRegion = btn.dataset.region;
    document.querySelectorAll('.region-tab').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    renderGrid();
  });
});

// 이벤트: 카테고리
document.querySelectorAll('.cat-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    currentCat = btn.dataset.cat;
    document.querySelectorAll('.cat-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    renderGrid();
  });
});

// 초기 렌더
renderGrid();
</script>
</body>
</html>
