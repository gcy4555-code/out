<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kim Chaewon Gallery</title>
    <style>
        /* 기본 스타일 초기화 */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #0f0f0f; /* 깊이감 있는 다크 모드 */
            color: #ffffff;
            font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, Roboto, sans-serif;
            padding: 4rem 2rem;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* 헤더 스타일 */
        header {
            margin-bottom: 3.5rem;
            text-align: center;
        }

        header h1 {
            font-size: 2.5rem;
            font-weight: 700;
            letter-spacing: -0.05em;
            margin-bottom: 0.5rem;
            background: linear-gradient(45deg, #ff758c, #ff7eb3); /* 은은한 핑크 그라데이션 */
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        header p {
            color: #a0a0a0;
            font-size: 1rem;
            font-weight: 300;
            letter-spacing: 0.05em;
        }

        /* 가로/세로 혼합형 사진을 위한 감각적인 그리드 레이아웃 */
        .gallery-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr); /* 3열 배열 */
            gap: 1.5rem;
            max-width: 1200px;
            width: 100%;
        }

        /* 이미지 카드 스타일 */
        .gallery-item {
            position: relative;
            border-radius: 16px;
            overflow: hidden;
            background-color: #1a1a1a;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            transition: transform 0.4s cubic-bezier(0.16, 1, 0.3, 1);
        }

        /* 가로로 긴 2번째, 5번째 사진은 그리드 안에서 유연하게 배치 */
        .gallery-item.landscape {
            grid-column: span 1; 
        }

        .gallery-item img {
            width: 100%;
            height: 100%;
            object-fit: cover; /* 이미지가 찌그러지지 않고 영역을 채우도록 설정 */
            display: block;
            transition: transform 0.5s ease;
        }

        /* 호버 이펙트 (마우스 올렸을 때) */
        .gallery-item:hover {
            transform: translateY(-6px); /* 카드가 부드럽게 떠오름 */
            box-shadow: 0 15px 35px rgba(255, 117, 140, 0.2); /* 은은한 핑크 광채 효과 */
        }

        .gallery-item:hover img {
            transform: scale(1.03); /* 사진이 살짝 확대됨 */
        }

        /* 반응형 레이아웃 (모바일/태블릿 화면 대응) */
        @media (max-width: 900px) {
            .gallery-grid {
                grid-template-columns: repeat(2, 1fr); /* 태블릿에선 2열 */
            }
        }

        @media (max-width: 600px) {
            body {
                padding: 2rem 1rem;
            }
            header {
                margin-bottom: 2rem;
            }
            header h1 {
                font-size: 1.8rem;
            }
            .gallery-grid {
                grid-template-columns: repeat(1, 1fr); /* 모바일에선 1열 */
                gap: 1rem;
            }
        }
    </style>
</head>
<body>

    <header>
        <h1>KIM CHAEWON</h1>
        <p>PHOTO GALLERY</p>
    </header>

    <main class="gallery-grid">
        <div class="gallery-item">
            <img src="ams.V01.photo.HDN.P.20251017.P12025101708570126892382366_P1.jpg" alt="김채원 사진 1">
        </div>
        
        <div class="gallery-item landscape">
            <img src="maxresdefault.jpg" alt="김채원 사진 2">
        </div>
        
        <div class="gallery-item">
            <img src="2026051914551036231_1.jpg" alt="김채원 사진 3">
        </div>
        
        <div class="gallery-item">
            <img src="133951448.1.jpg" alt="김채원 사진 4">
        </div>
        
        <div class="gallery-item landscape">
            <img src="mFnzP8xZNSnw-gOn3C0Iv_g1rLmhdUcF3b6f3WeDtJ7OTWKBcP8A9bfv9Bo2gVaHU0XSroXez13jjj87l6oWnQ.webp" alt="김채원 사진 5">
        </div>
        
        <div class="gallery-item">
            <img src="images.jpg" alt="김채원 사진 6">
        </div>
    </main>

</body>
</html>
